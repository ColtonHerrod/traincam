name: Build and Release

on:
  push:
    branches:
      - 'main'
  workflow_dispatch: # Allows manual trigger
  release:
    types: [published]

jobs:
  # ====================
  # 1. Build Native Artifacts (x86/x64)
  # ====================
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        arch: [amd64]
        include:
          - os: ubuntu-latest
            binary-name: traincam-ubuntu
            platform: linux/amd64
          - os: windows-latest
            binary-name: traincam-windows.exe
            platform: windows/amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Ubuntu Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Build ${{ matrix.os }}
        run: |
          export PATH=${PATH}:$(go env GOPATH)/bin
          wails build -platform ${{ matrix.platform }} -tags webkit2_41
          mv build/bin/traincam build/bin/${{matrix.binary-name}}
        if: matrix.os == 'ubuntu-latest'

      - name: Build ${{ matrix.os }}
        run: |
          set PATH=%PATH%:%GOPATH%/bin
          wails build -platform ${{ matrix.platform }}
          mv build/bin/traincam.exe build/bin/${{matrix.binary-name}}
        if: matrix.os == 'windows-latest'

      - name: Upload artifact - ${{ matrix.os }}
        uses: actions/upload-artifact@v7
        with:
          name: traincam-${{ matrix.os }}-${{ matrix.arch }}
          path: build/bin/${{ matrix.binary-name }}
          retention-days: 30
          if-no-files-found: error
          archive: false
        if: github.event_name == 'release'

  # ====================
  # 3. Create Release (Runs only on tags and uses generated artifacts)
  # ====================
  create-release:
    needs: [build,] # Ensure builds complete first
    runs-on: ubuntu-latest
    environment: production # Use a protected environment if desired
    permissions: write-all
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Create GitHub Release
        run: |
          # The git tag automatically provides the release version (e.g., v1.2.3)
          RELEASE_TAG=${GITHUB_REF_NAME}

          # Create the GitHub Release via CLI (requires GITHUB_TOKEN access)
          gh release upload ${{github.event.release.tag_name}} ./release-assets/**/* --repo ${GITHUB_REPOSITORY}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: github.event_name == 'release'
