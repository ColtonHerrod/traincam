name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64]
        include:
          - os: ubuntu-latest
            binary-name: traincam
          - os: macos-latest
            binary-name: traincam
          - os: windows-latest
            binary-name: traincam.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Download frontend dependencies
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build ${{ matrix.os }}
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -platform ${{ matrix.os }}/${{ matrix.arch }}

      - name: Upload artifact - ${{ matrix.os }}
        uses: actions/upload-artifact@v4
        with:
          name: traincam-${{ matrix.os }}-${{ matrix.arch }}
          path: build/bin/${{ matrix.binary-name }}
          retention-days: 30
          if-no-files-found: error

  build-arm64:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            binary-name: traincam-arm64
            platform: linux/arm64
          - os: macos-latest
            binary-name: traincam-arm64
            platform: darwin/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build ${{ matrix.os }} (ARM64)
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          wails build -platform ${{ matrix.platform }}

      - name: Upload artifact - ${{ matrix.os }}-arm64
        uses: actions/upload-artifact@v4
        with:
          name: traincam-${{ matrix.os }}-arm64
          path: build/bin/${{ matrix.binary-name }}
          retention-days: 30
          if-no-files-found: error