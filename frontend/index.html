<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Train Cam Tracker</title>
    </head>
    <body>
        <div id="container">
            <div id="map"></div>
            <div id="sidebar">
                <div id="controls">
                    <button id="import-btn">Import KML/KMZ</button>
                    <div id="import-status"></div>
                </div>
                <h2 id="cam-name">Select a Camera</h2>
                <div id="camera-list">
                    <ul id="cameras-list"></ul>
                </div>
                <div id="video-container">
                    <!-- YouTube iframe will be injected here -->
                    <p>Click a camera to view live feed.</p>
                </div>
            </div>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <!-- Wails runtime is automatically injected here -->
        <script src="main.js"></script>
    </body>
</html>
